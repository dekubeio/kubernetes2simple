name: Build & Upload Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml cryptography

      - name: Fetch build tools
        run: |
          curl -fsSL -o build-distribution.py \
            https://raw.githubusercontent.com/dekubeio/dekube-engine/main/build-distribution.py
          curl -fsSL -o dekube-manager.py \
            https://raw.githubusercontent.com/dekubeio/dekube-manager/main/dekube-manager.py

      - name: Download extensions
        run: |
          extensions=$(python -c "import json; print(' '.join(json.load(open('distribution.json'))['extensions']))")
          python dekube-manager.py --no-distribution -d .build $extensions

      - name: Build kubernetes2simple.py
        run: |
          python build-distribution.py kubernetes2simple \
            --extensions-dir .build/extensions \
            --base-distribution helmfile2compose

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" kubernetes2simple.py
